databases:
  - name: familyfinancials-db
    databaseName: familyfinancials
    user: familyfinancials
    plan: free

services:
  - type: web
    name: familyfinancials
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyfinancials-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_USERNAME
        value: admin
      - key: MASTER_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
